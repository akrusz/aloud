<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Closing card for the Play listing promo video. Modes + the site, no CTA
       (Play discourages "download now" prompts inside the video itself). -->
  <defs>
    <radialGradient id="orb" cx="45%" cy="45%" r="78%">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset="0.18" stop-color="#f8f288"/>
      <stop offset="0.38" stop-color="#f5d820"/>
      <stop offset="0.49" stop-color="#ffb805"/>
      <stop offset="0.65" stop-color="#ed7326"/>
      <stop offset="0.71" stop-color="#e71f75"/>
      <stop offset="0.76" stop-color="#870a3e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="ringglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.1"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.26" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.36" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.51" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.56" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="ringmask">
      <rect width="1080" height="1920" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1080" height="1920" fill="#110d08"/>

  <!-- ripple rings, as on share-card.svg and the app icon: radii 1.27 / 1.82 /
       2.44 times the orb's, faded out before the type. -->
  <g mask="url(#ringmask)">
    <circle cx="540" cy="820" r="153" fill="none" stroke="#e71f75" stroke-width="12.3" opacity="0.248" filter="url(#ringglow)"/>
    <circle cx="540" cy="820" r="153" fill="none" stroke="#e71f75" stroke-width="4.1" opacity="0.55"/>
    <circle cx="540" cy="820" r="218" fill="none" stroke="#e71f75" stroke-width="10.2" opacity="0.126" filter="url(#ringglow)"/>
    <circle cx="540" cy="820" r="218" fill="none" stroke="#e71f75" stroke-width="3.4" opacity="0.28"/>
    <circle cx="540" cy="820" r="293" fill="none" stroke="#e71f75" stroke-width="8.1" opacity="0.068" filter="url(#ringglow)"/>
    <circle cx="540" cy="820" r="293" fill="none" stroke="#e71f75" stroke-width="2.7" opacity="0.15"/>
  </g>

  <circle cx="540" cy="820" r="130" fill="#e71f75" opacity="0.42" filter="url(#glow)"/>
  <circle cx="540" cy="820" r="120" fill="url(#orb)"/>

  <g font-family="Knewave" font-size="104" text-anchor="middle" letter-spacing="3">
    <text x="540" y="857" fill="#000000" stroke="#000000" stroke-width="18"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
    <text x="540" y="857" fill="#e71f75" stroke="#ffd820" stroke-width="10"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
  </g>

  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#f5e8e6" font-size="50">
    <text x="540" y="1080">exploration</text>
    <text x="540" y="1160">noting</text>
    <text x="540" y="1240">felt sense</text>
  </g>

  <text x="540" y="1420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="46" fill="#ffd820">aloud.rest</text>
</svg>
