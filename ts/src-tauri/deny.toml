# cargo-deny configuration. Run locally with `cargo deny check` (after
# `cargo install cargo-deny`); CI runs it in .github/workflows/security.yml.
#
# CI runs `check` (all of advisories + bans + sources + licenses). The
# allow-list below has been reconciled against the actual dependency tree —
# the only non-permissive-MIT/Apache outlier today is `Unlicense` (public
# domain dedication used by whisper-rs).

[advisories]
# Fail on any crate with a known security advisory or that's been yanked.
yanked = "deny"
# Unsound advisories too, however deep: the default ("workspace") fails only
# direct dependencies, so a transitive one passed here silently while
# Dependabot still reported it.
unsound = "all"
# Add RUSTSEC IDs here (with a comment + expiry plan) to temporarily accept a
# specific advisory that has no fix yet.
ignore = [
    # Each entry says why it can't reach us and what clears it. Re-check this
    # list on every Tauri bump (it's almost all Tauri transitives).
    #
    # unic-* Unicode crates — also Tauri transitives, project is archived.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # proc-macro-error — maintainer unreachable; transitive build dep.
    "RUSTSEC-2024-0370",
    # quick-xml 0.39.4 DoS advisories (attribute-dedup blowup / unbounded
    # namespace-declaration allocation). Both are fixed in quick-xml >=0.41.0,
    # but we can't reach it: the only path is tauri -> plist, and plist 1.9.0
    # (latest) pins quick-xml ^0.39. Low real risk here — plist only parses our
    # own Info.plist at build/bundle time, not untrusted input. Drop these the
    # moment plist ships a quick-xml 0.41 bump (re-check on every Tauri bump).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # glib 0.18.5, unsound (GHSA-wrw7-89jp-8q8g on Dependabot): the iterator
    # behind Variant::array_iter_str() can dereference NULL. Linux only, via
    # Tauri's GTK3 stack (gtk/webkit2gtk 0.18). Nothing calls it: not glib's
    # own crates, our code, or anything between (gtk3-rs, webkit2gtk,
    # javascriptcore, libappindicator, wry, tao, muda, tray-icon, tauri and
    # its plugins; checked October 2026, soup3 not checked). Fixed in glib
    # 0.20, which is gtk4-rs; drop this once Tauri's Linux backend moves to
    # GTK4.
    "RUSTSEC-2024-0429",
    # zip 4.6.1: yanked (zip yanked every release before 9.0.3), and its
    # extract() advisories (October 2026): 0367 keeps SUID/SGID bits, 0368
    # lets a symlink point outside the destination, 0369 applies permissions
    # through symlinks. Our only path is tauri-plugin-updater, Windows-only,
    # and even its latest (2.14.0, and 3.0.0-alpha.3) pins zip ^4. 0367/0369
    # are cfg(unix) in zip, so they can't run there, and the updater extracts
    # only an update whose signature it has already checked against our key,
    # so a crafted archive needs our signing key. Drop these once the updater
    # moves to zip >=9.0.3.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    { crate = "zip@4.6.1", reason = "yanked; only via tauri-plugin-updater, which pins zip ^4 and extracts signature-verified updates" },
    # zvariant, zbus_names, zvariant_derive: unmaintained, folded into zbus 6
    # (October 2026). Linux only, via tauri-plugin-opener -> zbus 5, and even
    # opener's latest (2.7.2, and 3.0.0-alpha.3) pins zbus ^5.9. Drop these
    # once opener moves to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[bans]
# Warn (don't fail) on duplicate versions of a crate — the Tauri + ort trees
# pull a lot of transitive deps, so duplicates are expected; this just surfaces
# them for periodic cleanup.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io and known git sources — block a dependency sneaking in from an
# unknown registry or fork.
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Reconciled against the actual tree; expand when a new dep brings in a new
# license. Add a comment naming the offending crate so the next reviewer
# knows which dep justifies the entry.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # whisper-rs / whisper-rs-sys — public-domain dedication.
    "Unlicense",
    # webpki-roots / webpki-root-certs.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Our own crate is AGPL-3.0; skip workspace crates in the license check rather
# than allow AGPL globally (we don't want to silently pull an AGPL dep in).
private = { ignore = true }
