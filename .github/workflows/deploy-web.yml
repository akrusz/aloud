name: Deploy web app (UI → GitHub Pages)

# Manual only — builds the hosted browser app and publishes the whole docs/
# tree (marketing site + freshly built app) straight to GitHub Pages as an
# artifact. NOTHING is committed back to the branch, so there's nothing to pull
# after a deploy. This replaces the older "commit docs/app to the branch" flow.
#
# REQUIRES Pages source = "GitHub Actions" (Settings → Pages → Build and
# deployment → Source). With the old "Deploy from a branch" source this workflow
# does nothing useful. The custom domain (aloud.rest) is preserved via docs/CNAME,
# which is included in the uploaded artifact.
#
# Kept manual (workflow_dispatch), like deploy-server.yml: a UI ship is a
# deliberate act, and the build bakes in build-time config you choose when you
# run it. Flip on the `push` trigger below if you later want CD on every merge.
#
# BRANCHES: the UI code lives on `ts-core`; this file is also committed to `main`
# only so the "Run workflow" button shows (workflow_dispatch needs the file on
# the default branch). When you run it, pick **Use workflow from: ts-core** — it
# builds the app from whatever branch you dispatch from. The guard step fails
# fast if you forget. (Drop the note + guard at the ts-core→main cutover.)
#
# Required repo settings (Settings → Secrets and variables → Actions → Variables):
#   - ALOUD_CLOUD_URL   the hosted /cloud origin, e.g. https://aloud-cloud.fly.dev
#                        (already used by tauri-release.yml)
#   - GOOGLE_CLIENT_ID   the web OAuth client id (= GOOGLE_CLIENT_IDS on the
#                        server). NOT secret — it's baked into the public client.
on:
  workflow_dispatch:
  # push:
  #   branches: [ts-core]
  #   paths: ['ts/ui/**', 'ts/src/**', 'ts/package.json', 'ts/package-lock.json']

# Pages deployment needs these; contents:read is enough since we no longer push.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Ensure the UI is present (run from the ts-core branch)
        run: |
          if [ ! -d ts/ui ]; then
            echo "::error::No ts/ui here — re-run with Use workflow from ts-core (main is the legacy Python app)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: ts
        run: npm ci

      - name: Build hosted UI → docs/app
        working-directory: ts
        run: npm run ui:build:hosted
        env:
          VITE_ALOUD_CLOUD_URL: ${{ vars.ALOUD_CLOUD_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole site: committed marketing pages + the just-built docs/app.
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
