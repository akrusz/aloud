name: Rust check

# Type/borrow-check gate for the Tauri desktop shell (ts/src-tauri). ci.yml is
# TS-only; before this, Rust was only compiled by tauri-release.yml at release
# time, so a broken shell could sit on a branch for weeks. `cargo check` is the
# cheap middle ground: it compiles (including the whisper-rs / espeak-rs C/C++
# build scripts, hence cmake) but skips codegen/linking and the bundling
# toolchain (no patchelf/libfuse2 needed). Path-filtered so pure TS pushes
# don't pay for it; the cargo cache keeps the native deps warm between runs.
on:
  push:
    paths:
      - "ts/src-tauri/**"
      - ".github/workflows/rust-check.yml"
  pull_request:
    paths:
      - "ts/src-tauri/**"
      - ".github/workflows/rust-check.yml"

jobs:
  cargo-check:
    # 24.04 to match tauri-release.yml (WebKitGTK 4.1 packages).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # Subset of tauri-release.yml's apt step: the -dev packages Tauri 2's
      # build scripts probe via pkg-config, plus CMake/build-essential for
      # whisper-rs / espeak-rs. Bundling-only tools (patchelf, libfuse2)
      # are not needed for `cargo check`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ts/src-tauri

      - name: cargo check
        run: cargo check --manifest-path ts/src-tauri/Cargo.toml --locked
