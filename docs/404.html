<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — this page isn't aloud.</title>
  <meta name="robots" content="noindex">

  <!-- SPA deep-link fallback for the web app at /app/ (meditation-pal-sgp).
       GitHub Pages has no rewrite rule, so a hard refresh / shared link to
       /app/settings etc. lands here. We rewrite ONLY paths under /app/ into a
       query the app can decode (?/settings) and bounce to /app/, where Pages
       serves /app/index.html and its decode snippet restores the real path.
       Every other 404 (a genuine marketing miss) falls through and renders the
       styled page below. Runs first so the bounce happens before any paint.
       Trick: rafgraph/spa-github-pages, segment count 1 = the '/app' prefix. -->
  <script>
    (function () {
      var p = location.pathname;
      if (p.indexOf('/app/') === 0 && p !== '/app/') {
        var seg = 1;
        location.replace(
          location.protocol + '//' + location.host +
          p.split('/').slice(0, 1 + seg).join('/') + '/?/' +
          p.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
        );
      }
    })();
  </script>

  <link rel="icon" type="image/png" href="/assets/aloud.png">
  <link rel="apple-touch-icon" href="/assets/aloud.png">

  <link rel="preload" href="/assets/fonts/knewave-v15.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/css/style.css">

  <!-- Theme bootstrap — see index.html. Absolute asset paths because a 404
       can be served at any URL depth and the address bar keeps that path. -->
  <script>
    (function() {
      var TTL = 4 * 60 * 60 * 1000;
      try {
        var raw = localStorage.getItem('aloud-site-theme');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && saved.value && saved.ts && (Date.now() - saved.ts < TTL)) {
            document.documentElement.setAttribute('data-theme', saved.value);
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="/">aloud.</a>
    <a class="nav-link" href="https://krusz.net" target="_blank" rel="noopener">krusz.net</a>
    <a class="nav-link" href="https://github.com/akrusz/aloud" target="_blank" rel="noopener">github</a>
    <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light / dark"></button>
  </nav>

  <main class="notfound">
    <div class="orb-wrap" aria-hidden="true">
      <div class="orb"></div>
    </div>
    <p class="notfound-code">404</p>
    <h1 class="notfound-title">this page isn't aloud.</h1>
    <p class="notfound-sub">whatever you were looking for isn't here. take a breath and head back.</p>
    <div class="hero-cta">
      <a class="btn btn-primary" href="/">back home</a>
    </div>
  </main>

  <script src="/js/theme.js" defer></script>
</body>
</html>
