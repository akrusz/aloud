<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- viewport-fit=cover lets the app draw into the notch/Dynamic Island
             area on mobile; the nav + bottom bar then pad themselves back out of
             it with env(safe-area-inset-*). Without cover, those insets report 0
             and the top nav would sit under the status-bar clock (bead 3or7). -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>aloud.</title>
        <meta
            name="description"
            content="A voice-based meditation facilitator. Speak what you notice, and aloud asks thoughtful questions to guide you."
        />

        <!-- Favicon. %BASE_URL% is replaced by Vite with the deploy base ('/'
             in dev/desktop, '/app/' on the hosted build), so the icons resolve
             under either base; the files ship from ui/public/. The .ico is
             declared first and matters for Safari: it largely ignores a lone
             512px `rel=icon` PNG and falls back to /favicon.ico, so without the
             .ico the tab icon is blank there (Firefox/Chrome use the PNG fine). -->
        <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="%BASE_URL%aloud.png" />
        <link rel="apple-touch-icon" href="%BASE_URL%aloud.png" />

        <!-- Share / OpenGraph. Absolute URLs (a share card is fetched by an
             external crawler, so relative paths won't resolve); reuses the
             marketing site's 1200×630 card. -->
        <meta property="og:title" content="aloud. — a voice-based meditation facilitator" />
        <meta
            property="og:description"
            content="Speak what you notice, and aloud will ask thoughtful questions to guide you. For somatic exploration, parts work, and noting meditation."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://aloud.rest/app/" />
        <meta property="og:site_name" content="aloud." />
        <meta property="og:image" content="https://aloud.rest/assets/aloud-share.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="aloud. — a voice-based meditation facilitator" />
        <meta
            name="twitter:description"
            content="Speak what you notice, and aloud will ask thoughtful questions to guide you."
        />
        <meta name="twitter:image" content="https://aloud.rest/assets/aloud-share.png" />
        <!-- Decode the SPA deep-link redirect from the Pages 404.html (paths
             under /app/). Restores the real path (e.g. /app/settings) from the
             ?/… query BEFORE the router reads location, so a hard refresh /
             shared link resolves to the right view. No-op for normal loads and
             for the dev/desktop build (base '/'). Pairs with docs/404.html.
             Must stay a classic inline script so it runs before the deferred
             module (main.ts → route-base.ts). (rafgraph/spa-github-pages) -->
        <script>
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function (s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            })(window.location);
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Knewave&display=block"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <!-- First-paint boot orb. The real rainbow orb in its kasina (gaze)
             form — large, full-opacity, centered — so the page shows a single
             calm orb during the gap between CSS paint and the JS bundle / first
             view render (on GitHub Pages the bundle is a noticeable beat). On
             boot, app.ts (settleBootOrb) fades it out and fades the small idle
             orb into the top bar. Styled entirely by the imported stylesheet's
             .orb/.orb-kasina rules (a blocking <link>, so painted first). -->
        <div class="orb orb-kasina" id="boot-orb" role="status" aria-label="Loading aloud"></div>
        <!-- In the Tauri desktop shell the nav doubles as the window title bar.
             Dragging is wired in JS (tauri-chrome.ts) with a movement threshold
             so the whole bar — including over links/logo — drags the window
             while plain clicks still pass through. -->
        <nav class="nav">
            <div class="nav-start">
                <a href="#" class="nav-brand" id="aboutLink" title="About aloud.">aloud.</a>
            </div>
            <!-- nav-center is populated by the session view (orb + hamburger).
                 Idle pages leave it empty. -->
            <div class="nav-center" id="navCenter"></div>
            <div class="nav-links" id="navLinks">
                <a href="#" data-nav="setup" class="nav-active"><span class="nav-word-new">New </span>Session</a>
                <a href="#" data-nav="history">History</a>
                <a href="#" data-nav="account" class="nav-link-account hidden">Account</a>
                <a href="#" data-nav="settings">Settings</a>
                <!-- Hidden until the startup update check flags the brand with
                     has-update (about.ts → runStartupUpdateNudge); revealed via
                     :has(.nav-brand.has-update) .update-btn. Click opens About. -->
                <button type="button" class="update-btn" id="updateBtn" title="Update available - click for details" aria-label="Update available">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Update</span>
                </button>
                <button type="button" class="theme-toggle"
                    data-theme-toggle aria-label="Toggle theme"></button>
            </div>
        </nav>

        <main class="main">
            <div id="app-root">
                <!-- Setup, session, and history views mount here. Until the
                     first view renders, the page isn't blank — the centered
                     #boot-orb (in <body>) stands in, then flies up into the nav
                     on boot. -->
            </div>
        </main>

        <!-- Mobile bottom-nav — shown ≤767px (the imported CSS hides the top
             nav-links there). Links route through the SPA router via data-nav;
             the active class is synced in app.ts:setActiveNav. The bottom-nav
             is hidden during an active session (body[data-session-active]);
             mid-session mobile controls are a follow-up (floating hamburger). -->
        <nav class="bottom-nav" aria-label="Primary">
            <a href="#" data-nav="setup" class="bottom-nav-link">
                <svg class="bottom-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
                <span class="bottom-nav-label">Session</span>
            </a>
            <a href="#" data-nav="history" class="bottom-nav-link">
                <svg class="bottom-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/><polyline points="12 7 12 12 15 14"/></svg>
                <span class="bottom-nav-label">History</span>
            </a>
            <a href="#" data-nav="settings" class="bottom-nav-link">
                <svg class="bottom-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                <span class="bottom-nav-label">Settings</span>
            </a>
            <button type="button" class="bottom-nav-link" id="bottomNavMore" aria-haspopup="true" aria-controls="mobileMoreSheet" data-mobile-more-open>
                <svg class="bottom-nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
                <span class="bottom-nav-label">More</span>
            </button>
        </nav>

        <!-- Mobile "More" sheet — utility actions for phones. Fullscreen /
             window-close are omitted (Tauri-native). The update entry mirrors
             the nav pill: hidden until has-update flags the brand, then opens
             About. Session-only End/History land with the in-session hamburger
             follow-up. -->
        <div class="mobile-more-sheet hidden" id="mobileMoreSheet" role="dialog" aria-label="More options" aria-modal="true">
            <div class="mobile-more-backdrop" data-mobile-more-close></div>
            <div class="mobile-more-panel">
                <button type="button" class="mobile-more-action mobile-more-end" id="moreEnd" data-session-only>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                    <span>End session</span>
                </button>
                <button type="button" class="mobile-more-action" id="moreHistory" data-session-only>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/><polyline points="12 7 12 12 15 14"/></svg>
                    <span>History</span>
                </button>
                <button type="button" class="mobile-more-action" id="moreSessionInfo" data-session-only>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/></svg>
                    <span>Session info</span>
                </button>
                <div class="mobile-more-divider" data-session-only></div>
                <button type="button" class="mobile-more-action mobile-more-update" id="moreUpdate">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Update available</span>
                </button>
                <button type="button" class="mobile-more-action nav-link-account hidden" id="moreAccount" data-nav="account">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    <span>Account</span>
                </button>
                <button type="button" class="mobile-more-action" id="moreAbout">
                    <span class="mobile-more-glyph">aloud.</span>
                    <span>About</span>
                </button>
                <button type="button" class="mobile-more-action" id="moreTheme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span>Toggle theme</span>
                </button>
                <button type="button" class="mobile-more-cancel" data-mobile-more-close>Cancel</button>
            </div>
        </div>

        <!-- About modal — lifted from base.html. The version line + update
             status/install button (#aboutUpdate) are populated by about.ts. -->
        <div class="about-modal-overlay hidden" id="aboutModal">
            <div class="about-modal">
                <div class="about-modal-header">
                    <span class="about-modal-title">About</span>
                    <button class="voice-modal-close" id="aboutClose">&times;</button>
                </div>
                <div class="about-modal-body">
                    <div class="about-app-name"><a href="https://aloud.rest" target="_blank" rel="noopener">aloud.</a></div>
                    <div class="about-version" id="aboutVersion"></div>
                    <div class="about-update hidden" id="aboutUpdate"></div>
                    <div class="about-author">By Alex Krusz</div>
                    <div class="about-links">
                        <a href="https://krusz.net" target="_blank" rel="noopener">krusz.net</a>
                        <a href="https://github.com/akrusz" target="_blank" rel="noopener">GitHub</a>
                    </div>
                    <div class="about-donate-label">donate</div>
                    <div class="about-links about-donate">
                        <a href="https://ko-fi.com/alexkrusz" target="_blank" rel="noopener">ko-fi</a>
                        <a href="https://venmo.com/Alex-Krusz" target="_blank" rel="noopener">venmo</a>
                        <span class="about-eth" title="Show crypto address & QR">krusz.eth</span>
                        <a href="mailto:lexkrusz@gmail.com?subject=aloud">kind words</a>
                    </div>
                    <div class="about-crypto hidden" id="aboutCrypto">
                        <img class="about-crypto-qr" src="%BASE_URL%krusz-eth-qr.svg" width="120" height="120" alt="QR code for the krusz.eth donation address" />
                        <button type="button" class="about-crypto-addr" id="aboutCryptoAddr" title="Click to copy the full address">0x7895…E2Ca</button>
                        <div class="about-crypto-note">ETH or stablecoins · Ethereum &amp; Base</div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
