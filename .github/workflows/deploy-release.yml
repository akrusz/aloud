name: Release deploy (server → web)

# ONE TAG SHIPS EVERYTHING. Publishing a GitHub release deploys aloud cloud and
# then the hosted app from that same tag, so client and API can't drift. Desktop
# rides the same release (tauri-release.yml, on `created`).
#
# ORDER IS DELIBERATE: server first, web second, `needs:` between them. New UI
# against an old server is the skew that breaks — it calls fields that aren't
# there yet; an old client against a new server is the normal state of the world
# (desktop/mobile update on their own schedule), which is why the server contract
# stays backward-compatible regardless. So a failed server deploy blocks the web
# half rather than stranding a client ahead of its API.
#
# Not gated on a release: marketing pages under docs/ (every push to main, see
# deploy-web.yml). Out of band: mobile stores.
#
# REQUIRES a `v*` tag rule on the github-pages environment (Settings →
# Environments → github-pages → Deployment branches and tags). A reusable
# workflow runs under the CALLER's ref, so the web job here runs as the release
# TAG — and Pages ships with a default-branch-only policy, which rejected
# v2.3.0's deploy with "not allowed to deploy to github-pages". Checking out
# main inside the job does not help: the policy reads the run's ref, not the
# checkout. Recovery if it happens again: run deploy-web.yml from main with
# app_ref set to the tag.
#
# Re-run after a failure with this workflow's button + the tag, or the individual
# deploy-server / deploy-web buttons.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v2.1.2)"
        type: string
        required: true

jobs:
  server:
    uses: ./.github/workflows/deploy-server.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
    # FLY_API_TOKEN lives on the production environment declared in the called
    # workflow; inherit passes the org/repo secrets through to it.
    secrets: inherit

  web:
    needs: server
    # A called workflow gets the CALLER's job permissions, so Pages needs them
    # declared here as well as in deploy-web.yml.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-web.yml
    with:
      app_ref: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
