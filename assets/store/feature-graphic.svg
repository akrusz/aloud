<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Google Play feature graphic (1024x500). Derived from share-card.svg;
       same orb gradient + wordmark treatment, no URL (the listing has it). -->
  <defs>
    <radialGradient id="orb" cx="45%" cy="45%" r="78%">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset="0.18" stop-color="#f8f288"/>
      <stop offset="0.38" stop-color="#f5d820"/>
      <stop offset="0.49" stop-color="#ffb805"/>
      <stop offset="0.65" stop-color="#ed7326"/>
      <stop offset="0.71" stop-color="#e71f75"/>
      <stop offset="0.76" stop-color="#870a3e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <!-- dark brand background -->
  <rect width="1024" height="500" fill="#110d08"/>

  <!-- soft pink halo behind the orb -->
  <circle cx="512" cy="205" r="155" fill="#e71f75" opacity="0.45" filter="url(#glow)"/>

  <!-- orb -->
  <circle cx="512" cy="205" r="145" fill="url(#orb)"/>

  <!-- wordmark over the orb: black outline (back) + yellow stroke + pink fill (front) -->
  <g font-family="Knewave" font-size="124" text-anchor="middle" letter-spacing="3">
    <text x="512" y="248" fill="#000000" stroke="#000000" stroke-width="20"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
    <text x="512" y="248" fill="#e71f75" stroke="#ffd820" stroke-width="12"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
  </g>

  <!-- tagline -->
  <text x="512" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="38" fill="#f5e8e6">a voice-based meditation facilitator</text>
</svg>
