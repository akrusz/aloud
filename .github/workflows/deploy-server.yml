name: Deploy server (Fly)

# Deploying spends money and the Fly app + volume + secrets must already be
# provisioned (see dev-docs/deploy.md). Two ways in, no push trigger on purpose:
#
#   - a RELEASE, via deploy-release.yml, which runs this first and only then
#     publishes the matching web app, so client and server ship together;
#   - the manual button, for a hotfix or to re-run a failed deploy.
#
# A hosted billing server should never redeploy itself from a code push.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy (default: the branch this is run from)"
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fail fast if the deploy token isn't configured rather than half-running.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty = the triggering ref, which is what the manual button wants.
          ref: ${{ inputs.ref }}
      # Pinned to a commit, not @master or a tag: this job holds the Fly deploy
      # token, and either of those can be moved to new code under it.
      # Dependabot bumps the hash and the version comment together.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Run from ts/ so the Docker build context includes ../src (@aloud/core);
      # the Dockerfile + fly.toml live under server/.
      - run: flyctl deploy --config server/fly.toml --remote-only
        working-directory: ts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
