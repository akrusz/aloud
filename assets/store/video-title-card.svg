<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- Opening card for the Play listing promo video. Portrait, to match a phone
       screen recording. Same orb + wordmark treatment as feature-graphic.svg. -->
  <defs>
    <radialGradient id="orb" cx="45%" cy="45%" r="78%">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset="0.18" stop-color="#f8f288"/>
      <stop offset="0.38" stop-color="#f5d820"/>
      <stop offset="0.49" stop-color="#ffb805"/>
      <stop offset="0.65" stop-color="#ed7326"/>
      <stop offset="0.71" stop-color="#e71f75"/>
      <stop offset="0.76" stop-color="#870a3e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="#110d08"/>

  <circle cx="540" cy="940" r="200" fill="#e71f75" opacity="0.45" filter="url(#glow)"/>
  <circle cx="540" cy="940" r="185" fill="url(#orb)"/>

  <g font-family="Knewave" font-size="158" text-anchor="middle" letter-spacing="4">
    <text x="540" y="995" fill="#000000" stroke="#000000" stroke-width="26"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
    <text x="540" y="995" fill="#e71f75" stroke="#ffd820" stroke-width="15"
          stroke-linejoin="round" paint-order="stroke">aloud.</text>
  </g>

  <text x="540" y="1240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="52" fill="#f5e8e6">a voice-based meditation facilitator</text>
</svg>
